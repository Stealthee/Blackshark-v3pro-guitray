[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynapse"
version = "0.1.10"
description = "GTK4 control panel for the Razer BlackShark V3 (openrazer razerkraken driver)"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "Mehmet Bayoglu"}]
requires-python = ">=3.9"
dependencies = ["PyGObject"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Environment :: X11 Applications :: GTK",
]

[project.optional-dependencies]
tray = ["Pillow"]

[project.urls]
Homepage = "https://github.com/Stealthee/Blackshark-v3pro-guitray"
"Bug Tracker" = "https://github.com/Stealthee/Blackshark-v3pro-guitray/issues"

[project.scripts]
lynapse = "lynapse.app:main"

[tool.setuptools]
packages = ["lynapse"]

[tool.setuptools.package-data]
lynapse = []
